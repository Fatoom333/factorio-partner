note-guard=__1__ guards the buildings within __2__ tiles around you.
note-guard-denied=Forbidden in the mod settings: __1__. Guard not enabled.
note-guard-failed=Could not change the guard: __1__
note-no-body=No helper near you to guard.
note-unguard=__1__ no longer guards the buildings.
note-unguard-later=__1__ stops guarding once the taken buildings are back.
note-unguard-none=No guard is on.
