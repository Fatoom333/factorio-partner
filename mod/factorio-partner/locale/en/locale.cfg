[mod-setting-description]
partner-owner=Name of the player whose orders the partner accepts. Empty: player #1.
partner-helper-name=Label above the helper, map tag and chat name. Helpers after the first get their id appended (h2...).
partner-owner-words=The mod itself parses the owner's chat: stop, come here, what are you doing, continue. Off: the agent decides everything.
partner-stop-words=Comma-separated words. A short owner message (up to 4 words for "стоп", "стой", "stop", up to 3 for the others) that starts or ends with such a word stops the helper. Empty: default list.
partner-come-phrases=Comma-separated phrases. An owner message made only of such a phrase calls the helper to the owner. Empty: default list.

partner-perm-take-chests=Take items from the owner's free chests.
partner-perm-take-lines=Take from the outputs of the owner's lines and machines.
partner-perm-take-inputs=Take items from machine input slots and fuel.
partner-perm-build=Place buildings, blueprints, layouts, ghosts, belts, pipes and wires.
partner-perm-superforced=build_blueprint with force=superforced.
partner-perm-deconstruct-own=Deconstruct buildings placed by helpers.
partner-perm-deconstruct-owner=Deconstruct buildings placed by the owner.
partner-perm-set-recipe=Change the recipe in the owner's machine.
partner-perm-chop=Mine trees and rocks (ore is always allowed).
partner-perm-smelt=get_items smelts in the owner's free furnaces.
partner-perm-spend=A build task spending more items than the spending limit.
partner-perm-shoot=Enable the shoot reflex.
partner-perm-turrets=Enable the ammo reflex.
partner-perm-upkeep=Enable the upkeep reflex.
partner-perm-attack-nests=Shoot at nests and worms. Never: only a worm the body stands within range of.
partner-perm-walk-far=Walk farther from the owner than the distance limit.
partner-perm-leave-planet=Actions on a surface other than the body's.
partner-perm-auto=Switching on AUTO: self - no confirmation, ask - as now, never - do not enable.
partner-spend-limit=Items one build task may spend without permission.
partner-far-distance=Tiles from the owner beyond which walking needs permission.
partner-helpers=How many helpers to launch by default.
partner-pilot-model=Model for the body pilot.
partner-strategist-model=Model for the strategist.
partner-thoughts=Show strategist thoughts in chat by default.
partner-voice-pause=Seconds the voice waits for the owner to finish typing.
partner-budget-strategist=5-hour usage at which the strategist stops.
partner-budget-voice-only=Usage at which only the voice stays.
partner-budget-weekly=Weekly usage at which agents are not started.
partner-flee-health=Default flee health threshold.
partner-auto-armor=Put on armor after respawn and corpse pickup.
partner-turret-standoff=The body stays behind the turret line when refilling.
partner-turret-gap=Minimum tiles to turrets while refilling.
partner-answer-every=The voice answers every owner message.
partner-reply-lines=At most this many lines in a voice reply.

