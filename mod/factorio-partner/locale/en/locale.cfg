[mod-setting-name]
partner-owner=Partner owner
partner-helper-name=Helper name
partner-owner-words=Owner words (stop, come here, what are you doing)
partner-stop-words=Stop words
partner-come-phrases=Come-here phrases

[mod-setting-description]
partner-owner=Name of the player whose orders the partner accepts. Empty: player #1.
partner-helper-name=Label above the helper, map tag and chat name. Helpers after the first get their id appended (h2...).
partner-owner-words=The mod itself parses the owner's chat: stop, come here, what are you doing, continue. Off: the agent decides everything.
partner-stop-words=Comma-separated words. A short owner message (up to 4 words for "стоп", "стой", "stop", up to 3 for the others) that starts or ends with such a word stops the helper. Empty: default list.
partner-come-phrases=Comma-separated phrases. An owner message made only of such a phrase calls the helper to the owner. Empty: default list.

[partner-command]
help=factorio-partner: RCON only, /partner <JSON>
