[mod-setting-description]
partner-owner=Имя игрока, чьи приказы принимает напарник. Пусто — игрок №1.
partner-helper-name=Подпись над помощником, метка на карте и имя в чате. У второго и дальше добавляется id (h2…).
partner-owner-words=Мод сам разбирает сообщения хозяина: стоп, «иди сюда», «что делаешь», «продолжай». Выключено — всё решает агент.
partner-stop-words=Слова через запятую. Короткое сообщение хозяина (до 4 слов для «стоп», «стой», «stop», до 3 — для остальных), которое начинается или кончается таким словом, останавливает помощника. Пусто — стандартный список.
partner-come-phrases=Фразы через запятую. Сообщение хозяина целиком из такой фразы зовёт помощника к хозяину. Пусто — стандартный список.

partner-perm-take-chests=Брать предметы из свободных сундуков хозяина (extract, collect, get_items).
partner-perm-take-lines=Брать из выходов линий и машин хозяина (from_lines и extract из машины).
partner-perm-take-inputs=Вынимать предметы из входных слотов машин и топлива постройки хозяина.
partner-perm-build=Ставить постройки, чертежи, блоки и призраки, соединять ленты, трубы и провода.
partner-perm-superforced=build_blueprint с force=superforced (поверх чужих построек и деревьев).
partner-perm-deconstruct-own=Разбирать постройки, которые поставили помощники.
partner-perm-deconstruct-owner=Разбирать постройки, поставленные хозяином.
partner-perm-set-recipe=Менять рецепт в машине хозяина (в машине помощника можно, как разбирать свои).
partner-perm-chop=Добывать деревья и камни (руда разрешена всегда).
partner-perm-smelt=get_items плавит в свободных печах хозяина.
partner-perm-spend=Одна задача стройки, которая тратит больше предметов, чем задано в пределе трат.
partner-perm-shoot=Включить рефлекс shoot (стрельба по врагам).
partner-perm-turrets=Включить рефлекс ammo (заправка турелей).
partner-perm-upkeep=Включить рефлекс upkeep (топливо, патроны, ремонт по расписанию).
partner-perm-attack-nests=Стрелять по гнёздам и червям. «Нельзя» — не целится, кроме червя, в радиусе которого стоит тело.
partner-perm-walk-far=Ходить дальше предела расстояния от хозяина (если хозяин в игре).
partner-perm-leave-planet=Действия на другой поверхности, чем у тела.
partner-perm-auto=Включение режима AUTO: «сам» — без подтверждения, «спросить» — как сейчас, «нельзя» — не включать.
partner-spend-limit=Сколько предметов может потратить одна задача стройки без разрешения.
partner-far-distance=Клеток от хозяина, дальше которых идти нужно разрешение.
partner-helpers=Сколько помощников запускать по умолчанию.
partner-pilot-model=Модель, на которой работает пилот тела.
partner-strategist-model=Модель, на которой работает стратег.
partner-thoughts=Показывать мысли стратега в чате по умолчанию.
partner-voice-pause=Сколько секунд голос ждёт, пока хозяин допишет сообщения.
partner-budget-strategist=С какого расхода 5-часового лимита стратег замолкает.
partner-budget-voice-only=С какого расхода остаётся только голос.
partner-budget-weekly=С какого недельного расхода агенты не запускаются.
partner-flee-health=Порог отступления flee по умолчанию.
partner-auto-armor=Надевать броню после возрождения и подбора трупа.
partner-turret-standoff=Тело при заправке стоит за линией турелей.
partner-turret-gap=Не ближе стольки клеток к турелям при заправке.
partner-answer-every=Голос отвечает на каждое сообщение хозяина.
partner-reply-lines=Не больше стольки строк в ответе голоса.

