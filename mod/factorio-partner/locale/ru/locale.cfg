[mod-setting-name]
partner-owner=Хозяин напарника
partner-helper-name=Имя помощника
partner-owner-words=Слова хозяина (стоп, иди сюда, что делаешь)
partner-stop-words=Стоп-слова
partner-come-phrases=Фразы «иди сюда»

[mod-setting-description]
partner-owner=Имя игрока, чьи приказы принимает напарник. Пусто — игрок №1.
partner-helper-name=Подпись над помощником, метка на карте и имя в чате. У второго и дальше добавляется id (h2…).
partner-owner-words=Мод сам разбирает сообщения хозяина: стоп, «иди сюда», «что делаешь», «продолжай». Выключено — всё решает агент.
partner-stop-words=Слова через запятую. Короткое сообщение хозяина (до 4 слов для «стоп», «стой», «stop», до 3 — для остальных), которое начинается или кончается таким словом, останавливает помощника. Пусто — стандартный список.
partner-come-phrases=Фразы через запятую. Сообщение хозяина целиком из такой фразы зовёт помощника к хозяину. Пусто — стандартный список.

[partner-command]
help=factorio-partner: только для RCON, /partner <JSON>
