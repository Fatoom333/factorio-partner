[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-partner"
version = "0.1.0"
description = "MCP server: Claude plays a second character in a Factorio save through the factorio-partner mod"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    # RCON transport; async client needs anyio (also a dependency of mcp)
    "factorio-rcon-py[async]>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
factorio-partner-mcp = "factorio_partner.server:main"
factorio-partner-cli = "factorio_partner.cli:main"

[tool.setuptools.packages.find]
include = ["factorio_partner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
