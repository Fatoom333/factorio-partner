name: release

# Tag v<version> (the version from mod/factorio-partner/info.json) -> GitHub release with the mod zip
# and the matching CHANGELOG.md section as notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the mod version
        run: |
          ver=$(python -c 'import json; print(json.load(open("mod/factorio-partner/info.json", encoding="utf-8"))["version"])')
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match info.json version $ver" >&2
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build the mod zip
        run: |
          mkdir -p dist
          python tools/pc/pack.py mod --src mod/factorio-partner --out dist
          ls -l dist

      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          ver = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(ver) + r"\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else ""
          open("dist/notes.md", "w", encoding="utf-8").write(body + "\n")
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/factorio-partner_*.zip \
            --title "factorio-partner $VERSION" --notes-file dist/notes.md
